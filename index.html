<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="theme-color" content="#1B2A3A">
<title>Treino — Liberato (v7.2)</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
:root{
  --tinta:#16222E;
  --tinta-clara:#4A5A68;
  --papel:#F2EFE9;
  --papel-alto:#FBFAF7;
  --linha:#D6D0C5;
  --azul:#1B4F7A;
  --azul-fraco:#E3ECF3;
  --verde:#2E6B3E;
  --verde-fraco:#E4EFE5;
  --ambar:#8A5A0B;
  --ambar-fraco:#F7EEDC;
  --vinho:#7A2233;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px;
  line-height:1.45;
  padding-bottom:90px;
}

/* ---------- CABEÇALHO ---------- */
header{
  background:var(--tinta);
  color:var(--papel-alto);
  padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;
  position:sticky;top:0;z-index:50;
}
header h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.02em}
header .sub{margin-top:2px;font-size:13px;color:#9FB0BE}

/* ---------- ABAS ---------- */
nav{
  display:flex;background:var(--tinta);position:sticky;
  top:calc(env(safe-area-inset-top) + 58px);z-index:49;
  border-top:1px solid #2C3E4E;
}
nav button{
  flex:1;background:none;border:none;color:#8FA3B3;
  font-size:15px;font-weight:600;padding:13px 4px 11px;
  font-family:inherit;cursor:pointer;border-bottom:3px solid transparent;
}
nav button.on{color:#fff;border-bottom-color:#C9A227;background:#22364A}
nav button small{display:block;font-size:10px;font-weight:400;letter-spacing:.04em;margin-top:2px;opacity:.8}

/* ---------- CONTEÚDO ---------- */
main{padding:16px 12px}
.aviso{
  background:var(--ambar-fraco);border-left:4px solid var(--ambar);
  padding:11px 13px;border-radius:0 6px 6px 0;font-size:14px;
  color:#5C3E08;margin-bottom:16px;line-height:1.5;
}
.grupo{
  font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--tinta-clara);margin:22px 0 9px;padding-bottom:5px;
  border-bottom:2px solid var(--linha);
}
.grupo:first-of-type{margin-top:4px}

/* ---------- CARTÃO DE EXERCÍCIO ---------- */
.ex{
  background:var(--papel-alto);border:1px solid var(--linha);
  border-radius:9px;margin-bottom:13px;overflow:hidden;
}
.ex-topo{padding:13px 14px 11px}
.ex-num{
  display:inline-block;background:var(--tinta);color:#fff;
  font-size:12px;font-weight:700;width:22px;height:22px;line-height:22px;
  text-align:center;border-radius:4px;margin-right:8px;vertical-align:1px;
}
.ex-nome{font-size:17px;font-weight:600;display:inline}
.ex-alvo{font-size:13px;color:var(--tinta-clara);margin-top:6px}
.ex-meta{
  display:inline-block;margin-top:9px;background:var(--azul-fraco);color:var(--azul);
  font-size:13px;font-weight:700;padding:4px 11px;border-radius:5px;
  font-variant-numeric:tabular-nums;
}
.ex-dica{
  font-size:14px;color:#3E4C58;margin-top:10px;line-height:1.55;
  background:var(--papel);padding:9px 11px;border-radius:6px;
}
.ex-dica b{color:var(--vinho)}
.ex-video{
  display:block;margin-top:10px;font-size:14px;color:var(--azul);
  text-decoration:none;font-weight:600;padding:9px 12px;
  border:1px solid var(--azul);border-radius:6px;text-align:center;
}
.ex-video:active{background:var(--azul-fraco)}

/* ---------- SÉRIES ---------- */
.series{border-top:1px solid var(--linha);background:var(--papel)}
.serie-cab,.serie-lin{
  display:grid;grid-template-columns:44px 1fr 1fr 78px;
  align-items:center;gap:8px;padding:7px 14px;
}
.serie-cab{
  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--tinta-clara);border-bottom:1px solid var(--linha);padding-top:9px;padding-bottom:7px;
}
.serie-lin{border-bottom:1px solid #E8E3DA}
.serie-lin:last-child{border-bottom:none}
.serie-n{font-size:14px;font-weight:700;color:var(--tinta-clara)}
.series input{
  width:100%;font-family:inherit;font-size:19px;font-weight:600;
  text-align:center;padding:10px 4px;border:1px solid var(--linha);
  border-radius:6px;background:#fff;color:var(--tinta);
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;
}
.series input::-webkit-outer-spin-button,
.series input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.series input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-fraco)}
.series input.recorde{border-color:var(--verde);background:var(--verde-fraco);color:var(--verde)}
.ant{
  font-size:12px;color:var(--tinta-clara);text-align:right;
  font-variant-numeric:tabular-nums;line-height:1.3;
}
.ant b{color:var(--tinta);font-weight:600}

/* ---------- RODAPÉ FIXO ---------- */
.barra{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--papel-alto);border-top:1px solid var(--linha);
  padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);
}
.barra .fila{display:flex;gap:8px}
.barra .fila + .fila{margin-top:8px}
.barra button{
  flex:1;font-family:inherit;font-size:15px;font-weight:700;
  padding:14px 6px;border-radius:8px;border:none;cursor:pointer;
}
.barra .fila + .fila button{font-size:13px;padding:11px 4px;font-weight:600}
.b-salvar{background:var(--verde);color:#fff}
.b-backup{background:var(--azul);color:#fff}
.b-limpar{background:var(--papel);color:var(--tinta-clara);border:1px solid var(--linha)!important}
.b-hist{background:var(--tinta);color:#fff;flex:0 0 108px}

/* ---------- HISTÓRICO ---------- */
.hist-item{
  background:var(--papel-alto);border:1px solid var(--linha);border-radius:8px;
  padding:12px 14px;margin-bottom:10px;font-size:14px;
}
.hist-item .d{font-weight:700;font-size:15px;margin-bottom:6px}
.hist-item .l{color:var(--tinta-clara);font-variant-numeric:tabular-nums;line-height:1.6}
.vazio{text-align:center;color:var(--tinta-clara);padding:40px 20px;font-size:15px}

/* ---------- AVISO SALVO ---------- */
/* ---------- ALERTA DE MEMÓRIA ---------- */
#alerta{
  display:none;background:#F7E4E4;border-left:5px solid var(--vinho);
  padding:13px 14px;margin:0 0 16px;border-radius:0 6px 6px 0;
  font-size:14px;color:#5E1622;line-height:1.55;
}
#alerta b{display:block;font-size:15px;margin-bottom:5px}
#alerta.ver{display:block}

/* ---------- SELO DE GRAVAÇÃO ---------- */
#selo{
  font-size:12px;color:var(--tinta-clara);text-align:center;
  padding:2px 0 10px;font-variant-numeric:tabular-nums;
}
#selo.ok{color:var(--verde);font-weight:600}
#selo.erro{color:var(--vinho);font-weight:700}

/* ---------- ÁREA DE CÓPIA MANUAL ---------- */
#copiar{display:none;padding:0 0 16px}
#copiar.ver{display:block}
#copiar textarea{
  width:100%;height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:11px;border:1px solid var(--linha);border-radius:7px;padding:10px;
  background:#fff;color:var(--tinta);
}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:96px;
  background:var(--tinta);color:#fff;padding:11px 20px;border-radius:24px;
  font-size:14px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:70;
}
#toast.ver{opacity:1}

.lembrete{background:var(--papel-alto);border:1px solid var(--linha);border-radius:6px;padding:9px 12px;font-size:14px;margin-bottom:6px;line-height:1.5}
.chips{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}
.chips .ex-meta{margin-top:0}
.ex-pausa{display:inline-block;background:var(--papel);color:var(--tinta-clara);font-size:13px;font-weight:700;padding:4px 11px;border-radius:5px}
details.tec{margin-top:11px;border:1px solid var(--linha);border-radius:7px;background:var(--papel)}
details.tec summary{list-style:none;cursor:pointer;padding:11px 12px;font-size:14px;font-weight:700;color:var(--azul);display:flex;justify-content:space-between}
details.tec summary::-webkit-details-marker{display:none}
details.tec summary::after{content:'▾';transition:transform .2s}
details.tec[open] summary::after{transform:rotate(180deg)}
.tec-in{padding:0 12px 12px}
.fig{background:var(--papel-alto);border-radius:6px;padding:8px 8px 6px;margin-bottom:10px;text-align:center}
.fig svg{width:100%;max-width:260px;height:auto}
.leg{font-size:12px;color:var(--tinta-clara);display:flex;gap:6px;align-items:center;justify-content:center}
.leg span{display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:6px}
.bl{font-size:15px;line-height:1.5;margin-bottom:9px;padding:9px 11px;border-radius:6px;background:var(--papel-alto)}
.bl b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--azul);margin-bottom:2px}
.bl.erro{background:#F8ECEA}.bl.erro b{color:#A8322A}
.bl.alt{background:transparent;border:1px dashed #9A9285}.bl.alt b{color:var(--tinta-clara)}
.bl small{font-size:12px;color:var(--tinta-clara)}
.vid-nota{font-size:12px;color:var(--tinta-clara);margin-top:6px;text-align:center;line-height:1.4}
.sync{background:var(--papel-alto);border:1px solid var(--linha);border-radius:8px;padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--tinta-clara)}
.sync a{color:var(--azul);font-weight:600}
.sync input{width:100%;padding:9px;border:1px solid var(--linha);border-radius:6px;font-size:13px;margin-bottom:8px;font-family:inherit}
.sync button{width:100%;padding:10px;border:none;border-radius:6px;background:var(--azul);color:#fff;font-weight:600;font-family:inherit;font-size:14px}
/* ---------- v7: POTÊNCIA, ÚLTIMA VEZ, ABA CORPO ---------- */
.ex-pot{display:inline-block;background:var(--verde-fraco);color:var(--verde);font-size:13px;font-weight:700;padding:4px 11px;border-radius:5px}
.ex-ult{font-size:12px;color:var(--tinta-clara);margin-top:7px}
.cartao{background:var(--papel-alto);border:1px solid var(--linha);border-radius:9px;padding:13px 14px;margin-bottom:13px}
.cartao h3{margin:0 0 9px;font-size:15px}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campos label{font-size:12px;font-weight:700;color:var(--tinta-clara);letter-spacing:.03em}
.campos input{width:100%;font-family:inherit;font-size:19px;font-weight:600;text-align:center;padding:10px 4px;border:1px solid var(--linha);border-radius:6px;background:#fff;color:var(--tinta);margin-top:4px;-moz-appearance:textfield}
.campos input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px var(--azul-fraco)}
.bt{width:100%;margin-top:12px;font-family:inherit;font-size:15px;font-weight:700;padding:13px;border:none;border-radius:8px;background:var(--verde);color:#fff;cursor:pointer}
.bt.sec{background:var(--papel);color:var(--tinta);border:1px solid var(--linha)}
.sinal{border-left:5px solid var(--verde);background:var(--verde-fraco);color:#1F4A2A;padding:11px 13px;border-radius:0 7px 7px 0;font-size:14px;line-height:1.5;margin-bottom:10px}
.sinal.amb{border-color:var(--ambar);background:var(--ambar-fraco);color:#5C3E08}
.sinal.ver{border-color:var(--vinho);background:#F7E4E4;color:#5E1622}
.sinal.neu{border-color:var(--linha);background:var(--papel-alto);color:var(--tinta-clara)}
.sinal b{display:block;font-size:14px;margin-bottom:2px}
.tab{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tab th{text-align:right;font-size:11px;color:var(--tinta-clara);font-weight:700;padding:6px 4px;border-bottom:2px solid var(--linha)}
.tab td{text-align:right;padding:7px 4px;border-bottom:1px solid #E8E3DA}
.tab th:first-child,.tab td:first-child{text-align:left}
.desce{color:var(--verde);font-weight:700}.sobe{color:var(--vinho);font-weight:700}.rapido{color:var(--vinho);font-weight:700}
nav button{font-size:14px;padding:12px 2px 10px}
/* ---------- v7.1 ---------- */
.ex-im{margin-top:10px;font-size:14px;line-height:1.5;background:var(--azul-fraco);color:#163F61;padding:8px 11px;border-radius:6px}
.ex-im b{color:var(--azul)}
.ex-reg{margin-top:8px;font-size:13px;line-height:1.5;color:var(--tinta-clara)}
.ex-reg b{color:var(--tinta)}
.ajuste{display:block;width:100%;margin-top:7px;font-family:inherit;font-size:14px;padding:8px 10px;border:1px dashed #9A9285;border-radius:6px;background:#fff;color:var(--tinta)}
.ajuste:focus{outline:none;border-style:solid;border-color:var(--azul)}
.ex-prox{margin-top:8px;font-size:13px;font-weight:700;line-height:1.45;color:var(--verde);background:var(--verde-fraco);padding:7px 10px;border-radius:5px}
.pl-link{display:block;font-size:13px;color:var(--azul);text-align:center;margin:-6px 0 14px;text-decoration:none;font-weight:600}
.pl-troca{display:block;text-align:right;font-size:12px;color:var(--tinta-clara);margin:4px 0 14px}
.barra .mais{display:none}
.barra.aberta .mais{display:flex}
body.mais-aberto{padding-bottom:150px}
.guia ol,.guia ul{margin:0;padding-left:21px;font-size:15px;line-height:1.55}
.guia li{margin-bottom:7px}
.guia li:last-child{margin-bottom:0}
.regra{margin-top:12px;background:var(--verde-fraco);color:#1F4A2A;padding:9px 11px;border-radius:6px;font-size:14px;line-height:1.5}
.campos .largo{grid-column:1 / -1}
.series input::placeholder{color:#B5AC9E;font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Treino — Liberato <span style="font-size:12px;color:#9FB0BE;font-weight:400">v7.2</span></h1>
  <div class="sub" id="hoje"></div>
</header>

<nav id="abas"></nav>

<main>
  <div id="alerta"></div>
  <div id="selo"></div>
  <div id="copiar">
    <div style="font-size:14px;margin-bottom:7px">Toque no texto, selecione tudo e copie. Cole em um e-mail para si mesmo ou em um arquivo do Google Drive.</div>
    <textarea id="copiar-txt" readonly onclick="this.select()"></textarea>
    <button onclick="fecharCopia()" style="margin-top:8px;width:100%;font-family:inherit;font-size:14px;font-weight:600;padding:11px;border-radius:7px;border:1px solid var(--linha);background:var(--papel);color:var(--tinta);cursor:pointer">Fechar</button>
  </div>
  <div id="tela"></div>
</main>

<input type="file" id="arquivo" accept=".json,application/json" style="display:none" onchange="importarArquivo(this)">

<div class="barra" id="barra">
  <div class="fila">
    <button class="b-salvar" onclick="salvarSessao()">Salvar sessão</button>
    <button class="b-hist" onclick="verHistorico()">Histórico</button>
  </div>
  <div class="fila">
    <button class="b-backup" onclick="exportarBackup()">Backup (Drive)</button>
    <button class="b-limpar" id="b-mais" onclick="alternarMais()">Mais ▾</button>
  </div>
  <div class="fila mais">
    <button class="b-limpar" onclick="exportarPlanilha()">Planilha</button>
    <button class="b-limpar" onclick="document.getElementById('arquivo').click()">Restaurar</button>
    <button class="b-limpar" onclick="limparDia()">Limpar</button>
  </div>
</div>

<div id="toast"></div>

<script>
/* ==================================================================
   VERSÃO 7 — divisão Superior/Inferior (cada músculo 2x por semana), aba Corpo
   (peso, cintura, pulso, caminhada), alertas de ritmo de perda, pulso e perda muscular,
   controle de deload. Histórico ligado pelo NOME do exercício: as cargas da v6 continuam valendo.
   ================================================================== */
const YT = t => 'https://www.youtube.com/results?search_query=' + encodeURIComponent(t);
const PROGRAMA = {
 "S1": {
  "titulo": "Superior 1",
  "aba": "Sup 1",
  "dia": "Segunda",
  "nota": "Empurrar e puxar em equilíbrio: cada série de peito tem uma de costas. Ênfase no peitoral superior.",
  "blocos": [
   {

      "erro": "Ombros saindo do encosto — a carga passa para a articulação.",
      "alt": "Supino reto com halteres (carga moderada)",
      "v": "supino máquina articulada execução correta",

       "dorsal"

      "sec": [
       "biceps",
       "delt_post"
      ],
      "dica": "Pegada um pouco mais aberta que os ombros. Puxe até o queixo, à frente do corpo. Peito para cima.",
      "erro": "Puxar atrás da nuca — posição de risco para o ombro nesta idade.",

      "alt": "Supino inclinado com halteres, 30°",
      "v": "supino inclinado smith execução correta"
     },
     {
      "n": "Remada sentada na polia baixa",
      "alvo": "Dorsais · romboides · trapézio médio",
      "series": 3,
      "meta": "3 × 10–12",
      "pausa": "2 min",
      "pri": [
       "dorsal"
      ],
      "sec": [
       "biceps",
       "delt_post",
       "trap"
      ],
      "dica": "Coluna neutra. Leve os cotovelos para trás e junte as escápulas. Volte controlando.",
      "erro": "Arredondar a lombar ao estender os braços.",

    ]
   },
   {
    "grupo": "Ombros",
    "exs": [
     {
      "n": "Elevação lateral na máquina",

      "series": 3,
      "meta": "3 × 12–15",
      "pausa": "60 s",
      "pri": [
       "delt_lat"
      ],
      "sec": [
       "trap"
      ],
      "dica": "Suba até a linha dos ombros, não acima. Cotovelo levemente dobrado.",
      "erro": "Encolher os ombros ao subir — o trapézio rouba o movimento.",
      "alt": "Elevação lateral com halteres ou unilateral na polia",
      "v": "elevação lateral máquina execução correta"
     }
    ]
   },
   {
    "grupo": "Braços",
    "exs": [
     {
      "n": "Tríceps na polia — barra reta",
      "alvo": "Tríceps",

      "pri": [
       "triceps"
      ],
      "sec": [],
      "dica": "Cotovelos colados ao tronco. Só o antebraço se move.",
      "erro": "Cotovelos avançando para frente — o ombro assume o trabalho.",

      "v": "tríceps polia barra execução correta"

function temDado(arr){ return (arr || []).some(x => x && (x.kg || x.reps)); }
function melhorCarga(nome){
  let m = 0;
  hist.forEach(s => {
    const i = nomesDaSessao(s).indexOf(nome); if(i < 0) return;
    ((s.dados || {})[i] || []).forEach(x => { const c = parseFloat(x && x.kg); if(c > m) m = c; });
  });
  return m;
}
function ultimaVez(nome){

    if(i >= 0 && temDado((s.dados || {})[i])) return {sets: s.dados[i], data: s.data, rot: s.nomes ? s.titulo : 'divisão antiga'};
  }

}

/* ================= SEMANAS, ALERTAS E DELOAD ================= */
const DIA_MS = 86400000;
function isoLocal(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dataDe(iso){ const [a,m,d] = iso.slice(0,10).split('-').map(Number); return new Date(a, m-1, d); }
function segundaDe(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return isoLocal(x); }
function ddmm(iso){ const d = dataDe(iso); return String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0'); }
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
const media = a => a.length ? a.reduce((x,y) => x + y, 0) / a.length : null;
const fmt = (v, c=1) => v === null ? '—' : v.toFixed(c).replace('.', ',');
const fmtCm = v => v === null ? '—' : fmt(v, Number.isInteger(v) ? 0 : 1);

function semanasCorpo(){
  const sem = {};
  corpo.forEach(r => {
    const k = segundaDe(dataDe(r.data));
    const s = sem[k] = sem[k] || {ini:k, peso:[], cintura:[], pulso:[], caminhada:0};
    const p = num(r.peso), c = num(r.cintura), b = num(r.pulso), w = num(r.caminhada);
    if(p !== null) s.peso.push(p);
    if(c !== null) s.cintura.push(c);
    if(b !== null) s.pulso.push(b);
    if(w !== null) s.caminhada += w;
  });
  return Object.values(sem).sort((a,b) => a.ini < b.ini ? -1 : 1);
}

/* Força estimada da melhor série (fórmula de Epley): carga × (1 + repetições ÷ 30). */
function forcaSemanal(){
  const porEx = {};
  hist.forEach(s => {
    const k = segundaDe(new Date(s.data)), nomes = nomesDaSessao(s);
    Object.keys(s.dados || {}).forEach(i => (s.dados[i] || []).forEach(x => {
      const kg = num(x && x.kg), r = num(x && x.reps);
      if(!kg || !r || r > 30) return;
      const f = kg * (1 + r / 30), nm = nomes[i]; if(!nm) return;
      porEx[nm] = porEx[nm] || {};
      if(!porEx[nm][k] || f > porEx[nm][k]) porEx[nm][k] = f;
    }));
  });
  return porEx;
}

function alertas(){
  const out = [], sem = semanasCorpo();
  /* 1. Ritmo de perda de peso: média semanal contra a semana anterior */
  const sp = sem.filter(s => s.peso.length);
  if(sp.length >= 2){
    const a = sp[sp.length-2], b = sp[sp.length-1];
    const dias = (dataDe(b.ini) - dataDe(a.ini)) / DIA_MS / 7 || 1;
    const queda = (media(a.peso) - media(b.peso)) / dias;
    if(queda > 0.5) out.push(['ver', 'Perda de peso rápida demais', `A média caiu ${fmt(queda,2)} kg por semana. Acima de 0,5 kg, nesta idade, sai músculo junto. Coma mais, sobretudo carboidrato no dia de treino.`]);
    else if(queda < -0.3) out.push(['amb', 'Peso subindo', `A média subiu ${fmt(-queda,2)} kg na semana. Numa fase de déficit, revise as porções antes de mudar o treino.`]);
    else out.push(['ok', 'Ritmo de perda adequado', `Variação de ${fmt(-queda,2)} kg na última semana — dentro do limite de 0,5 kg.`]);
  } else out.push(['neu', 'Ritmo de perda', 'Pese-se em jejum nas manhãs dos dias de treino. Com duas semanas de registros a avaliação aparece aqui.']);

  /* 2. Pulso de repouso: média das 3 últimas medidas contra a linha de base (mediana das 5 primeiras) */
  const pulsos = corpo.filter(r => num(r.pulso) !== null).sort((x,y) => x.data < y.data ? -1 : 1).map(r => num(r.pulso));
  if(pulsos.length >= 6){
    const base = [...pulsos.slice(0,5)].sort((x,y) => x - y)[2];
    const rec = media(pulsos.slice(-3));
    if(rec - base >= 10) out.push(['ver', 'Pulso de repouso elevado', `Média recente de ${fmt(rec,0)} batimentos contra ${fmt(base,0)} no início. Leve esse registro ao médico.`]);
    else if(rec - base >= 5) out.push(['amb', 'Pulso de repouso subindo', `Média recente de ${fmt(rec,0)} batimentos contra ${fmt(base,0)} no início. Pode ser cansaço acumulado ou sono ruim: avise no chat.`]);
    else out.push(['ok', 'Pulso de repouso estável', `Média recente ${fmt(rec,0)} · base ${fmt(base,0)} batimentos por minuto.`]);
  } else out.push(['neu', 'Pulso de repouso', `Conte o pulso ao acordar, ainda deitado, por 1 minuto. São necessárias 6 medidas para criar a sua base (faltam ${6 - pulsos.length}).`]);

  /* 3. Sentinela de perda muscular: força estimada caindo 2 semanas seguidas */
  const fs = forcaSemanal(), caindo = [];
  Object.keys(fs).forEach(nm => {
    const ks = Object.keys(fs[nm]).sort(); if(ks.length < 3) return;
    const [a,b,c] = ks.slice(-3).map(k => fs[nm][k]);
    if(b < a * 0.99 && c < b * 0.99) caindo.push(nm);
  });
  if(caindo.length >= 2) out.push(['ver', 'Sinal de perda muscular', `Força caindo há 2 semanas seguidas em: ${caindo.join('; ')}. Aumente as calorias e o sono antes de qualquer outra mudança.`]);
  else if(caindo.length === 1) out.push(['amb', 'Atenção a um exercício', `Força caindo há 2 semanas em: ${caindo[0]}. Um exercício isolado pode ser só cansaço; se aparecer um segundo, é sinal de perda muscular.`]);
  else out.push(['ok', 'Força preservada', 'Nenhum exercício com queda de força por 2 semanas seguidas.']);

  /* 4. Pressão arterial: leituras de 14/9 ou mais nos últimos 7 dias */
  const comPA = corpo.filter(r => leiturasPA(r.pa).length).sort((x,y) => x.data < y.data ? -1 : 1);
  if(comPA.length){
    const ult = comPA[comPA.length-1], hojeD = dataDe(isoLocal(new Date()));
    const recentes = comPA.filter(r => (hojeD - dataDe(r.data)) / DIA_MS <= 7).flatMap(r => leiturasPA(r.pa));
    const altas = recentes.filter(([a,b]) => a >= 140 || b >= 90);
    const txt = leiturasPA(ult.pa).map(([a,b]) => a + '/' + b).join(' · ');
    if(altas.length >= 2) out.push(['ver', 'Pressão alta repetida', `${altas.length} leituras de 14/9 ou mais nos últimos 7 dias. Procure o médico sem esperar a consulta.`]);
    else if(altas.length === 1) out.push(['amb', 'Uma leitura de pressão alta', 'Uma leitura de 14/9 ou mais nos últimos 7 dias. Meça de novo amanhã, sentado e depois de 5 minutos de repouso.']);
    else out.push(['ok', 'Pressão dentro do esperado', `Última medição (${ddmm(ult.data)}): ${txt} mmHg.`]);
  } else out.push(['neu', 'Pressão arterial', 'Nos 7 dias antes da consulta, meça sentado, depois de 5 minutos de repouso, duas vezes de manhã e duas à noite.']);
  return out;
}

function semanaDoCiclo(){
  if(!ciclo) return null;
  return Math.floor((dataDe(isoLocal(new Date())) - dataDe(ciclo)) / DIA_MS / 7) + 1;
}
function avisoDeload(){
  const w = semanaDoCiclo(); if(!w) return '';
  if(w >= 9) return `<div class="sinal ver"><b>Deload atrasado — semana ${w} do ciclo</b>Faça esta semana: mesmos exercícios, metade das séries, carga 10% menor. Depois toque em "Fiz o deload" na aba Corpo.</div>`;
  if(w >= 6) return `<div class="sinal amb"><b>Semana ${w} do ciclo — deload nesta ou na próxima semana</b>Mesmos exercícios, metade das séries, carga 10% menor. É na recuperação que o músculo se constrói.</div>`;
  return '';
}
function fizDeload(){
  if(!confirm('Registrar que o deload foi feito e iniciar um novo ciclo hoje?')) return;
  ciclo = isoLocal(new Date());
  try{ localStorage.setItem(K_CICLO, ciclo); }catch(e){}
  render(); toast('Novo ciclo iniciado');
}

/* ================= RENDERIZAÇÃO ================= */
function render(){
  if(modoHistorico) return renderHistorico();
  if(diaAtivo === 'CORPO') return renderCorpo();
  if(diaAtivo === 'GUIA') return renderGuia();
  const p = PROGRAMA[diaAtivo];
  let i = 0, html = '';

  html += avisoDeload() + aviso48h(diaAtivo) + avisoBackup();
  html += `<div class="aviso"><b>${p.titulo}</b> — ${p.dia}<br>${p.nota}</div>`;
  html += htmlPlaylist(diaAtivo);
  html += `<div class="lembrete"><b>Antes de tudo</b>: regule a máquina (linha "Antes da 1ª série").<br><b>Aquecimento</b>: ⅓ da carga × 15, depois ⅔ × 8. Não se anota.<br><b>Séries de trabalho</b>: mesma carga em todas, parando com 1–2 repetições de sobra. Digite o peso na 1ª série e ele se repete nas outras.<br><b>Respire</b>: solte o ar no esforço, como quem apaga uma vela. Nunca prenda.<br><b>Selo verde de potência</b>: suba rápido e controlado, desça em 3 s, sem tranco.</div>`;

  p.blocos.forEach(bloco => {
    html += `<div class="grupo">${bloco.grupo}</div>`;
    bloco.exs.forEach(ex => {
      const ei = i;
      const rec = melhorCarga(ex.n);
      const uv = ultimaVez(ex.n);
      const antes = uv ? uv.sets : [];
      const salvo = (atual[diaAtivo] && atual[diaAtivo][ei]) || [];
      const ext = EXTRA[ex.n];
      const prox = proximaVez(ex);
      const phKg = prox && prox.kg !== null ? fmtKg(prox.kg) : 'kg';

      let linhas = '';
      for(let s = 0; s < ex.series; s++){
        const v = salvo[s] || {kg:'', reps:''};
        const a = antes[s];
        const refAnt = a && (a.kg || a.reps)
          ? `<b>${a.kg||'—'}</b> kg<br>${a.reps||'—'} reps`
          : '<span style="opacity:.5">—</span>';
        linhas += `
        <div class="serie-lin">
          <div class="serie-n">${s+1}ª</div>
          <input type="number" inputmode="decimal" placeholder="${phKg}" value="${v.kg}"
                 data-d="${diaAtivo}" data-e="${ei}" data-s="${s}" data-c="kg" data-rec="${rec}"
                 oninput="anotar(this)">
          <input type="number" inputmode="numeric" placeholder="reps" value="${v.reps}"
                 data-d="${diaAtivo}" data-e="${ei}" data-s="${s}" data-c="reps"
                 oninput="anotar(this)">
          <div class="ant">${refAnt}</div>
        </div>`;
      }

      html += `
      <div class="ex">
        <div class="ex-topo">
          <span class="ex-num">${ei+1}</span><span class="ex-nome">${ex.n}</span>
          <div class="ex-alvo">${ex.alvo}</div>
          <div class="chips"><span class="ex-meta">${ex.meta}</span><span class="ex-pausa">pausa ${ex.pausa}</span>${ex.pot ? `<span class="ex-pot">${ex.pot}</span>` : ''}</div>
          ${ext ? `<div class="ex-im"><b>Imagine:</b> ${ext.im}</div><div class="ex-reg"><b>Antes da 1ª série:</b> ${ext.reg}</div>` : ''}
          <input class="ajuste" type="text" placeholder="Seu ajuste (ex.: banco no furo 4)" value="${esc(ajustes[ex.n])}" data-n="${encodeURIComponent(ex.n)}" onchange="salvarAjuste(this)">
          ${uv ? `<div class="ex-ult">Última vez: ${dataCurta(uv.data)} (${uv.rot})${rec ? ' · recorde ' + String(rec).replace('.', ',') + ' kg' : ''}</div>` : ''}
          ${prox ? `<div class="ex-prox">${prox.txt}</div>` : ''}
          <details class="tec" ${aberto[diaAtivo+ei] ? 'open' : ''} ontoggle="aberto['${diaAtivo}${ei}']=this.open">
            <summary>Técnica · como fazer · alternativa</summary>
            <div class="tec-in">
              <div class="fig">${figura(ex.pri, ex.sec)}
                <div class="leg"><span style="background:${F_PRI}"></span>principal <span style="background:${F_SEC}"></span>auxiliar</div></div>
              <div class="bl"><b>Como fazer</b>${ex.dica}</div>
              <div class="bl erro"><b>Evite</b>${ex.erro}</div>
              <div class="bl alt"><b>Máquina ocupada?</b>${ex.alt}<br><small>Mesma faixa de repetições. A carga não vale como recorde.</small></div>
              <a class="ex-video" href="${YT(ex.v)}" target="_blank" rel="noopener">Procurar vídeos no YouTube</a>
              <div class="vid-nota">Os vídeos são de terceiros e às vezes divergem entre si. Havendo conflito, vale o que está neste cartão.</div>
            </div>
          </details>
        </div>
        <div class="series">
          <div class="serie-cab"><div>Série</div><div>Carga</div><div>Reps</div><div style="text-align:right">Anterior</div></div>

        </div>
      </div>`;
      i++;
    });
  });

  document.getElementById('tela').innerHTML = html;
  document.querySelectorAll('.series input[data-c="kg"]').forEach(marcarRecorde);

function anotar(el){
  const {d, e, s, c} = el.dataset;
  atual[d] = atual[d] || {};
  atual[d][e] = atual[d][e] || [];
  const kgAntes = (atual[d][e][0] || {}).kg || '';
  atual[d][e][s] = atual[d][e][s] || {kg:'', reps:''};
  atual[d][e][s][c] = el.value;
  /* Repetições anotadas sem carga: vale a carga sugerida em "Próxima vez". */
  if(c === 'reps' && el.value && !atual[d][e][s].kg){
    const inpKg = document.querySelector(`.series input[data-d="${d}"][data-e="${e}"][data-s="${s}"][data-c="kg"]`);
    const sug = inpKg ? num(inpKg.placeholder) : null;
    if(sug !== null){ atual[d][e][s].kg = String(sug); inpKg.value = String(sug); marcarRecorde(inpKg); }
  }
  /* Carga única: o peso da 1ª série se repete nas outras que estavam vazias ou iguais a ela. */
  if(c === 'kg' && s === '0'){
    document.querySelectorAll(`.series input[data-d="${d}"][data-e="${e}"][data-c="kg"]`).forEach(inp => {
      const k = Number(inp.dataset.s); if(k === 0) return;
      const x = atual[d][e][k] = atual[d][e][k] || {kg:'', reps:''};
      if(!x.kg || x.kg === kgAntes){ x.kg = el.value; inp.value = el.value; marcarRecorde(inp); }
    });
  }
  gravar(K_ATUAL, atual);
  if(c === 'kg') marcarRecorde(el);
}

function marcarRecorde(el){
  const rec = parseFloat(el.dataset.rec) || 0;
  const v = parseFloat(el.value) || 0;
  el.classList.toggle('recorde', rec > 0 && v > rec);
}

/* ================= SALVAR ================= */
function salvarSessao(){
  if(!PROGRAMA[diaAtivo]) return toast('Abra a aba do treino do dia para salvar a sessão');
  const dados = atual[diaAtivo];
  if(!dados || !Object.keys(dados).length) return toast('Nada registrado neste dia ainda');
  let algum = false;
  Object.values(dados).forEach(arr => (arr||[]).forEach(x => { if(x && (x.kg || x.reps)) algum = true; }));
  if(!algum) return toast('Preencha ao menos uma série');

  hist.push({ v: 7, data: new Date().toISOString(), dia: diaAtivo, titulo: PROGRAMA[diaAtivo].titulo, nomes: nomesDoDia(diaAtivo), dados: JSON.parse(JSON.stringify(dados)) });
  if(!ciclo){ ciclo = isoLocal(new Date()); try{ localStorage.setItem(K_CICLO, ciclo); }catch(e){} }
  gravar(K_HIST, hist);
  delete atual[diaAtivo];
  gravar(K_ATUAL, atual);
  render();
  window.scrollTo(0,0);
  const sexta = new Date().getDay() === 5;
  toast(!MEMORIA_OK ? 'ATENÇÃO: faça o backup agora' : sexta ? 'Sessão salva. Sexta: toque em Backup' : 'Sessão salva');
  if(!MEMORIA_OK) setTimeout(exportarBackup, 900);
}

function limparDia(){
  if(!PROGRAMA[diaAtivo]) return toast('Nada a limpar nesta aba');
  if(!confirm('Apagar o que foi digitado em ' + PROGRAMA[diaAtivo].titulo + '? O histórico não será afetado.')) return;
  delete atual[diaAtivo];
  gravar(K_ATUAL, atual);
  render();
  toast(PROGRAMA[diaAtivo].titulo + ' limpo');
}

/* ================= HISTÓRICO ================= */
function verHistorico(){
  modoHistorico = true;
  montarAbas();
  renderHistorico();
  window.scrollTo(0,0);
}

function renderHistorico(){
  if(!hist.length){
    document.getElementById('tela').innerHTML =
      '<div class="vazio">Nenhuma sessão salva ainda.<br><br>Registre as cargas durante o treino e toque em <b>Salvar sessão</b> ao terminar.</div>';
    return;
  }
  let html = '<div class="grupo">Sessões registradas</div>';
  [...hist].reverse().forEach((s, idx) => {
    const nomes = nomesDaSessao(s);
    let linhas = '';
    Object.keys(s.dados).forEach(ei => {
      const sets = (s.dados[ei] || []).filter(x => x && (x.kg || x.reps));
      if(!sets.length) return;
      linhas += `<div>${nomes[ei] || 'Exercício ' + (+ei+1)}: ` +
                sets.map(x => `${x.kg||'—'}kg×${x.reps||'—'}`).join('  ·  ') + '</div>';
    });
    Object.keys(s.extra || {}).forEach(nm => {
      const sets = (s.extra[nm] || []).filter(x => x && (x.kg || x.reps));
      if(sets.length) linhas += `<div style="opacity:.7">${nm}: ` + sets.map(x => `${x.kg||'—'}kg×${x.reps||'—'}`).join('  ·  ') + '</div>';
    });
    html += `<div class="hist-item">
      <div class="d">${rotuloSessao(s)}</div>
      <div class="l" style="margin-bottom:7px">${dataCurta(s.data)}</div>
      <div class="l">${linhas}</div>
      <button onclick="apagarSessao(${hist.length-1-idx})"
        style="margin-top:10px;background:none;border:1px solid var(--linha);color:var(--tinta-clara);
               font-family:inherit;font-size:13px;padding:6px 12px;border-radius:5px;cursor:pointer">Apagar</button>
    </div>`;
  });
  document.getElementById('tela').innerHTML = html;
}

function apagarSessao(i){
  if(!confirm('Apagar esta sessão do histórico?')) return;
  hist.splice(i,1);
  gravar(K_HIST, hist);
  renderHistorico();
  toast('Sessão apagada');
}


/* ================= ABA CORPO ================= */
function renderCorpo(){
  const hoje = isoLocal(new Date());
  const r = corpo.find(x => x.data === hoje) || {};
  const v = k => r[k] ? String(r[k]).replace('.', ',') : '';
  let html = avisoDeload() + avisoBackup();
  html += `<div class="cartao"><h3>Registrar hoje — ${ddmm(hoje)}</h3>
    <div class="campos">
      <div><label>Peso em jejum (kg)</label><input id="c-peso" type="text" inputmode="decimal" placeholder="80,1" value="${v('peso')}"></div>
      <div><label>Cintura (cm)</label><input id="c-cintura" type="text" inputmode="decimal" placeholder="94" value="${v('cintura')}"></div>
      <div><label>Pulso ao acordar (bpm)</label><input id="c-pulso" type="text" inputmode="numeric" placeholder="62" value="${v('pulso')}"></div>
      <div><label>Aeróbico (min)</label><input id="c-caminhada" type="text" inputmode="numeric" placeholder="35" value="${v('caminhada')}"></div>
      <div class="largo"><label>Pressão (ex.: 12/8)</label><input id="c-pa" type="text" placeholder="12/8 12,5/8" value="${esc(r.pa)}"></div>
    </div>
    <button class="bt" onclick="salvarCorpo()">Salvar medidas de hoje</button>
    <div style="font-size:12px;color:var(--tinta-clara);margin-top:9px;line-height:1.5">Peso: nas manhãs dos dias de treino, ao acordar, após urinar, antes de comer. Cintura: a cada 2 semanas, na altura do umbigo, sem encolher a barriga. Pulso: às segundas, ao acordar, deitado, 1 minuto. Pressão: sentado, depois de 5 minutos de repouso; mais de uma leitura no dia, separe com espaço (12/8 12,5/8). Aeróbico: caminhada, esteira ou bicicleta. Preencha só o que mediu.</div>
  </div>`;

  html += '<div class="grupo">Sinais de alerta</div>';
  alertas().forEach(([cls, tit, txt]) => { html += `<div class="sinal ${cls === 'ok' ? '' : cls}"><b>${tit}</b>${txt}</div>`; });

  const sem = semanasCorpo().slice(-8).reverse();
  html += '<div class="grupo">Semana a semana</div>';
  if(sem.length){
    html += '<div class="cartao" style="padding:6px 10px"><table class="tab"><tr><th>Semana de</th><th>Peso médio</th><th>Variação</th><th>Cintura</th><th>Pulso</th><th>Aeróbico</th></tr>';
    sem.forEach((s, i) => {
      const prox = sem.slice(i+1).find(x => x.peso.length);
      const pm = media(s.peso), dv = (pm !== null && prox) ? pm - media(prox.peso) : null;
      const cls = dv === null ? '' : dv < -0.5 ? 'rapido' : dv < 0 ? 'desce' : dv > 0 ? 'sobe' : '';
      html += `<tr><td>${ddmm(s.ini)}</td><td>${fmt(pm)}</td><td class="${cls}">${dv === null ? '—' : (dv > 0 ? '+' : '') + fmt(dv)}</td>
        <td>${fmtCm(s.cintura.length ? s.cintura[s.cintura.length-1] : null)}</td><td>${fmt(media(s.pulso), 0)}</td><td>${s.caminhada ? s.caminhada + ' min' : '—'}</td></tr>`;
    });
    html += '</table><div style="font-size:12px;color:var(--tinta-clara);padding:8px 0 4px">Variação em vermelho: queda acima de 0,5 kg na semana. Meta de caminhada e aeróbico: rumo a 150 minutos por semana.</div></div>';
  }

  const cint = [...corpo].filter(x => num(x.cintura) !== null).sort((a,b) => a.data < b.data ? -1 : 1).pop();
  const cv = cint ? num(cint.cintura) : 94;
  const rel = cv / ALTURA_CM;
  html += `<div class="grupo">Cintura e meta</div><div class="cartao" style="font-size:14px;line-height:1.6">
    Cintura atual: <b>${fmtCm(cv)} cm</b>${cint ? ' (' + ddmm(cint.data) + ')' : ' (referência de set/2026)'} · meta: <b>abaixo de 86 cm</b><br>
    Relação cintura ÷ altura: <b>${fmt(rel, 2)}</b> — ${rel < 0.5 ? '<span class="desce">dentro da faixa saudável</span>' : 'faltam ' + fmt(cv - 86, 0) + ' cm para a faixa saudável (abaixo de 0,50)'}</div>`;

  const w = semanaDoCiclo();
  html += `<div class="grupo">Ciclo de treino</div><div class="cartao" style="font-size:14px;line-height:1.6">
    ${w ? `Semana <b>${w}</b> do ciclo (início em ${ddmm(ciclo)}). Deload entre a semana 6 e a 8.` : 'O ciclo começa automaticamente ao salvar a primeira sessão.'}
    <button class="bt sec" onclick="fizDeload()">Fiz o deload — iniciar novo ciclo</button>
    <button class="bt sec" onclick="exportarCorpo()">Exportar medidas (planilha)</button></div>`;

  document.getElementById('tela').innerHTML = html;
}

function salvarCorpo(){
  const hoje = isoLocal(new Date());
  const pega = id => document.getElementById(id).value.trim().replace(',', '.');
  const novo = {data: hoje, peso: pega('c-peso'), cintura: pega('c-cintura'), pulso: pega('c-pulso'), caminhada: pega('c-caminhada'), pa: document.getElementById('c-pa').value.trim()};
  if(!novo.peso && !novo.cintura && !novo.pulso && !novo.caminhada && !novo.pa) return toast('Preencha ao menos um campo');
  if(novo.pa){
    const ls = leiturasPA(novo.pa);
    if(!ls.length || ls.some(([a,b]) => a < 70 || a > 250 || b < 40 || b > 150)) return toast('Confira a pressão: use 12/8 ou 120/80');
  }
  const ruim = [['peso',40,200],['cintura',50,180],['pulso',30,150],['caminhada',1,600]].find(([k,a,b]) => novo[k] && (num(novo[k]) === null || num(novo[k]) < a || num(novo[k]) > b));
  if(ruim) return toast('Confira o valor de ' + ruim[0]);
  const i = corpo.findIndex(x => x.data === hoje);
  if(i >= 0) corpo[i] = novo; else corpo.push(novo);
  corpo.sort((a,b) => a.data < b.data ? -1 : 1);
  gravar(K_CORPO, corpo);
  render(); toast('Medidas salvas');
}

async function exportarCorpo(){
  const l = ['Data;Peso (kg);Cintura (cm);Pulso (bpm);Caminhada e aeróbico (min);Pressão (mmHg)'];
  corpo.forEach(r => l.push([ddmm(r.data) + '/' + r.data.slice(0,4), r.peso, r.cintura, r.pulso, r.caminhada].map(x => String(x || '').replace('.', ',')).concat([leiturasPA(r.pa).map(([a,b]) => a + '/' + b).join(' ')]).join(';')));
  const txt = '﻿' + l.join('\r\n');
  const n = nomeArquivo('csv').replace('treino-', 'medidas-');
  if(await baixar(txt, n, 'text/csv')) toast('Escolha onde salvar'); else abrirCopia(l.join('\n'));
}

/* ================= AVISO ================= */
let tmr;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('ver');
  clearTimeout(tmr);
  tmr = setTimeout(() => t.classList.remove('ver'), 2200);
}

/* ================= EXPORTAR / RESTAURAR ================= */

function nomeArquivo(ext){
  const d = new Date();
  return 'treino-liberato-' + d.getFullYear() +
         String(d.getMonth()+1).padStart(2,'0') +
         String(d.getDate()).padStart(2,'0') + '.' + ext;
}

async function baixar(texto, nome, tipo){
  try{
    const f = new File([texto], nome, {type: tipo});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      await navigator.share({files:[f], title:nome});
      return true;
    }
  } catch(e){ if(e && e.name === 'AbortError') return 'cancelado'; }
  try{
    const blob = new Blob([texto], {type: tipo + ';charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch(e){ return false; }
}

async function exportarPlanilha(){
  if(!hist.length && !Object.keys(atual).length) return toast('Nada para exportar ainda');
  const linhas = ['Data;Dia;Treino;Exercicio;Serie;Carga (kg);Repeticoes'];

  function despejar(dataISO, dia, dados, nomes, titulo){
    if(!nomes || !nomes.length) return;
    Object.keys(dados).forEach(ei => {
      (dados[ei] || []).forEach((x, s) => {
        if(!x || (!x.kg && !x.reps)) return;
        linhas.push([
          dataISO ? dataCurta(dataISO) : dataCurta(new Date().toISOString()),
          dia, titulo, (nomes[ei] || 'Exercicio ' + (+ei+1)),
          (s+1) + 'a', (x.kg || ''), (x.reps || '')
        ].join(';'));
      });
    });
  }

  hist.forEach(s => despejar(s.data, s.dia, s.dados, nomesDaSessao(s), s.titulo));
  Object.keys(atual).forEach(dia => { if(PROGRAMA[dia]) despejar(null, dia, atual[dia], nomesDoDia(dia), PROGRAMA[dia].titulo); });

  const txt = '\uFEFF' + linhas.join('\r\n');
  if(await baixar(txt, nomeArquivo('csv'), 'text/csv')){
    toast('Escolha onde salvar a planilha');
  } else {
    abrirCopia(linhas.join('\n'));
  }
}

function importarArquivo(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const leitor = new FileReader();
  leitor.onload = ev => {
    try{
      const p = JSON.parse(ev.target.result);
      if(!p || !Array.isArray(p.historico)) throw new Error('formato');
      if(!confirm('Restaurar ' + p.historico.length + ' sessão(ões) deste backup? O conteúdo atual será substituído.')) return;
      hist = p.historico;
      atual = p.em_andamento || {};
      if(!(p.versao >= 7.2)) migrarI1v72(atual);
      if(!(p.versao >= 6)) migrarTudo();
      if(Array.isArray(p.corpo)){ corpo = p.corpo; gravar(K_CORPO, corpo); }
      if(p.ciclo){ ciclo = p.ciclo; try{ localStorage.setItem(K_CICLO, ciclo); }catch(e){} }
      if(p.ajustes && typeof p.ajustes === 'object'){ ajustes = p.ajustes; gravar(K_AJUSTE, ajustes); }
      if(p.playlists && typeof p.playlists === 'object'){ playlists = p.playlists; gravar(K_PLAYLIST, playlists); }
      gravar(K_HIST, hist);
      gravar(K_ATUAL, atual);
      modoHistorico = false;
      montarAbas(); render();
      toast('Backup restaurado');
    } catch(e){
      toast('Arquivo inválido — use um backup do aplicativo');
    }
  };
  leitor.readAsText(f);
  input.value = '';
}

/* ================= v7.1: PRESSÃO, PRÓXIMA VEZ, AVISOS ================= */

/* Leituras de pressão: aceita 12/8, 12,5/8 ou 120/80; várias leituras separadas por espaço. */
function leiturasPA(t){
  const out = [], re = /(\d+(?:[.,]\d+)?)\s*[\/x×]\s*(\d+(?:[.,]\d+)?)/g;
  let m;
  while((m = re.exec(String(t || '')))){
    let a = num(m[1]), b = num(m[2]);
    if(a < 30) a *= 10;
    if(b < 20) b *= 10;
    out.push([Math.round(a), Math.round(b)]);
  }
  return out;
}

function fmtKg(v){ return String(Math.round(v * 10) / 10).replace('.', ','); }

/* Faixa de repetições do cartão ("3 × 10–12" → 10 a 12). Exercícios em segundos ou em duas máquinas ficam de fora. */
function faixa(meta){
  if(/cada|\ds\b|\bs\b/.test(meta)) return null;
  const m = String(meta).match(/×\s*(\d+)(?:\s*[–-]\s*(\d+))?/);
  if(!m) return null;
  return {min: Number(m[1]), max: Number(m[2] || m[1])};
}

/* Dupla progressão: decide a carga da próxima sessão a partir da última vez. */
function proximaVez(ex){
  const f = faixa(ex.meta), uv = ultimaVez(ex.n);
  if(!f || !uv) return null;
  const sets = (uv.sets || []).filter(x => x && num(x.kg) !== null && num(x.reps) !== null);
  if(!sets.length) return null;
  const kgs = sets.map(x => num(x.kg)), reps = sets.map(x => num(x.reps));
  const meta = '<span style="white-space:nowrap">' + (f.min === f.max ? String(f.max) : f.min + '–' + f.max) + '</span>';
  if(kgs.every(k => k === kgs[0])){
    const kg = kgs[0];
    if(Math.min(...reps) >= f.max) return {kg: null, txt: `Próxima vez: suba para o próximo peso da máquina. Com ${fmtKg(kg)} kg você chegou ao topo da faixa.`};
    if(Math.max(...reps) < f.min) return {kg: null, txt: `Próxima vez: volte ao peso anterior da máquina. Com ${fmtKg(kg)} kg as repetições ficaram abaixo de ${f.min}.`};
    return {kg, txt: `Próxima vez: mantenha ${fmtKg(kg)} kg e busque uma repetição a mais (meta ${meta}).`};
  }
  const boas = sets.filter(x => num(x.reps) >= f.min).map(x => num(x.kg));
  const kg = boas.length ? Math.max(...boas) : Math.min(...kgs);
  return {kg, txt: `Próxima vez: ${fmtKg(kg)} kg em todas as séries (meta ${meta}). Da última vez a carga mudou entre as séries.`};
}

/* Superior seguido de superior (ou inferior de inferior) em menos de 48 horas. */
const GRUPO = {S1: 'sup', S2: 'sup', I1: 'inf', I2: 'inf'};
function aviso48h(d){
  const g = GRUPO[d]; if(!g) return '';
  const hoje = isoLocal(new Date());
  for(let k = hist.length - 1; k >= 0; k--){
    const s = hist[k];
    if(GRUPO[s.dia] !== g) continue;
    const h = (Date.now() - new Date(s.data).getTime()) / 3600000;
    if(h >= 48 || h < 0 || isoLocal(new Date(s.data)) === hoje) return '';
    const outro = g === 'sup' ? 'um treino Inferior (Inf 1 ou Inf 2)' : 'um treino Superior (Sup 1 ou Sup 2)';
    return `<div class="sinal amb"><b>${esc(s.titulo)} foi feito há ${Math.round(h)} horas</b>Os mesmos músculos precisam de 48 horas para se recuperar. Hoje, prefira ${outro}.</div>`;
  }
  return '';
}

/* Lembrete de backup: toda sexta, ou quando o último passou de 8 dias. */
function avisoBackup(){
  if(!hist.length) return '';
  const hoje = isoLocal(new Date());
  if(ultimoBackup === hoje) return '';
  const como = 'Toque em <b style="display:inline">Backup (Drive)</b>, escolha o Drive e toque em Salvar.';
  if(new Date().getDay() === 5) return `<div class="sinal amb"><b>Hoje é sexta: dia de backup</b>Depois de salvar a sessão: ${como}</div>`;
  const dias = ultimoBackup ? Math.round((dataDe(hoje) - dataDe(ultimoBackup)) / DIA_MS) : null;
  if(dias === null) return `<div class="sinal amb"><b>Nenhum backup feito ainda</b>O histórico está só neste celular. ${como}</div>`;
  if(dias > 8) return `<div class="sinal amb"><b>Último backup há ${dias} dias</b>${como}</div>`;
  return '';
}

  toast(v ? 'Playlist guardada' : 'Playlist removida');
}
